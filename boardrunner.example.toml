# Written by `boardrunner.py init`. Secrets stay in environment variables.
mode = "dry-run"  # dry-run | live | off
me = "laptop"     # this machine's agent; the only line that differs between machines
timezone = "Europe/Berlin"

[board]
database_id = "<notion-database-id>"
token_env = "NOTION_TOKEN"
human_id = "<your-notion-user-id>"
bot_id = "<integration-user-id>"

# Every agent behaves the same. Only the environment differs.
[[agents]]
name = "laptop"
workdir = "~/work"
sandbox = "strict"
max_jobs = 3

[[agents]]
name = "server"
workdir = "/srv/work"
sandbox = "strict"
max_jobs = 1

[[humans]]
name = "me"
