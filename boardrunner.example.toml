# Reference: every key `boardrunner.py init` writes, plus optional ones. Use the file init writes, not this one.
# Secrets stay in the environment or in a .env beside the config.
mode = "dry-run"  # dry-run | live | off
me = "laptop"     # this machine's agent; differs per machine, as do primary and the agent's workdir
timezone = "Europe/Berlin"
# primary = false  # set on all machines but one; a primary handles human cards and shared warnings

[board]
database_id = "<notion-database-id>"
token_env = "NOTION_TOKEN"
human_id = "<your-notion-user-id>"
bot_id = "<integration-user-id>"

# Every agent behaves the same. Only the environment differs.
[[agents]]
name = "laptop"
workdir = "~/work"
sandbox = "strict"  # strict | off
max_jobs = 3
# model = "sonnet"
# max_minutes = 360
# instructions = "Extra rules for this agent"

[[agents]]
name = "server"
workdir = "/srv/work"
sandbox = "strict"
max_jobs = 1

[[humans]]
name = "me"
